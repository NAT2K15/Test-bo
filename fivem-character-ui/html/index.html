<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSDOJ Character Select</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <aside class="panel">
      <div class="brand">
        <!-- Drop your real logo in as logo.png; the SVG below is a fallback. -->
        <img src="logo.png" alt="SSDOJ" onerror="this.remove(); document.getElementById('logo-fallback').style.display='block';">
        <svg id="logo-fallback" viewBox="0 0 140 130" style="display:none">
          <g stroke="#c9c9c9" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M20 18 q-12 -4 -18 4 M20 18 q10 -8 20 -2 M20 18 q-4 -10 -14 -12 M20 18 q8 -2 14 8 M18 70 Q14 40 20 18"/>
            <path d="M120 18 q12 -4 18 4 M120 18 q-10 -8 -20 -2 M120 18 q4 -10 14 -12 M120 18 q-8 -2 -14 8 M122 70 Q126 40 120 18"/>
          </g>
          <path d="M70 8 L118 22 L114 80 Q108 108 70 124 Q32 108 26 80 L22 22 Z" fill="#2a3f7a"/>
          <path d="M70 14 L112 26 L108 79 Q102 102 70 117 Q38 102 32 79 L28 26 Z" fill="#a8302e"/>
          <g fill="#fff">
            <rect x="40" y="48" width="6" height="18"/><rect x="48" y="40" width="7" height="26"/>
            <rect x="57" y="30" width="8" height="36"/><rect x="67" y="22" width="6" height="44"/>
            <rect x="75" y="34" width="8" height="32"/><rect x="85" y="44" width="7" height="22"/>
            <rect x="94" y="50" width="6" height="16"/>
          </g>
          <text x="70" y="88" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
                font-size="26" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" paint-order="stroke">SSDOJ</text>
        </svg>
        <h1>Welcome to the<br>SSDOJ Framework</h1>
      </div>

      <!-- Server status -->
      <div class="status">
        <div class="status-aop">
          <span class="status-label">Current AOP</span>
          <span class="aop-value"><span class="dot"></span><span id="aop-value"></span></span>
        </div>
        <div class="status-row">
          <div><span class="status-label">Priority</span><span class="status-value" id="priority-value"></span></div>
          <div><span class="status-label">Peacetime</span><span class="status-value" id="peace-value"></span></div>
          <div><span class="status-label">Players</span><span class="status-value" id="online-value"></span></div>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn btn-create" id="btn-create">+ Create Character</button>
        <button class="btn btn-admin hidden" id="btn-admin">Admin</button>
      </div>

      <p class="subtitle">Select a character</p>
      <div id="char-list" class="char-list"></div>

      <footer class="footer">
        <span>SSDOJ Framework</span>
        <button class="link" id="btn-disconnect">Disconnect</button>
      </footer>
    </aside>

    <div class="world"></div>
  </div>

  <div id="modals"></div>
  <div id="toasts"></div>

  <script src="script.js"></script>
</body>
</html>
